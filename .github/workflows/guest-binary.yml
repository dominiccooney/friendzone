# Builds the Linux guest binary a non-Linux broker host serves from
# <data-dir>/guest-bin/. Fetch the artifact with:
#   gh run download --name fz-linux-x86_64
name: guest-binary
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  linux-x86_64:
    # 22.04 keeps the glibc floor low (2.35) so the binary runs in
    # older guest images too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cp target/release/fz fz-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: fz-linux-x86_64
          path: fz-linux-x86_64
          if-no-files-found: error
