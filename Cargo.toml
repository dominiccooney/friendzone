[package]
name = "friendzone"
version = "0.1.0"
edition = "2024"
default-run = "fz"

[[bin]]
name = "fz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
futures-util = "0.3"
h2 = "=0.4.19"
http-body-util = "0.1"
hudsucker = { version = "0.25", features = ["http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "logging", "tls12", "webpki-tokio"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tokio-rustls = "0.26"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["testing", "trace"] }

